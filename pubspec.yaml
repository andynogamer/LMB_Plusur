name: lmb_plusur
description: Aplicación móvil LMB Plusur para la zona sur de la Liga Mexicana de Béisbol.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  video_player: ^2.9.2
  cached_network_image: ^3.4.1
  # Activar cuando exista el módulo de Unity exportado para AR.
  # flutter_unity_widget: ^2022.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/data.json
    - assets/images/
