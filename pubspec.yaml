name: lmb_plusur
description: AplicaciÃ³n mÃ³vil LMB Plusur para la zona sur de la Liga Mexicana de BÃ©isbol.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  video_player: ^2.9.2
  cached_network_image: ^3.4.1
  shared_preferences: ^2.5.5
  audioplayers: ^6.8.1
  # Matrix4 for ArDetection.pose (architecture §3). Not an AR plugin.
  vector_math: ^2.1.4
  # D-12 detector. Exact pin — no caret (architecture §11).
  # Pulls permission_handler, geolocator, package_info_plus. No manual ARCore AAR.
  ar_flutter_plugin_plus: 1.1.3
  # Camera half of ArCoreImageTracker.isSupported. Already pulled by the plugin.
  permission_handler: 12.0.3
  # Activar cuando exista el mÃ³dulo de Unity exportado para AR.
  # flutter_unity_widget: ^2022.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/data.json
    - assets/ar_markers.json
    - assets/images/
    - assets/sfx/
    # AR reference images (D-20/D-21). Filename stem == Marcador.id.
    # Only the first three go in the active tracking database; bravos is the
    # printable spare. See docs/ar-marker-guide.md.
    - assets/markers/
    # Per-marker GLBs for the live AR session (AR-06). Not a WebView viewer.
    - assets/models/marcador_estadio_leones/
    - assets/models/marcador_jugador_olmecas/
    - assets/models/marcador_trofeo_piratas/
